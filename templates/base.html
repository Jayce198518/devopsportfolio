<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ profile.name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}" class="nav-brand">{{ profile.name.split()[-1][:2].upper() }}</a>
    <ul class="nav-links">
      <li><a href="{{ url_for('home') }}">Home</a></li>
      <li><a href="{{ url_for('projects_page') }}">Projects</a></li>
      <li><a href="{{ url_for('contact') }}">Contact</a></li>
    </ul>
    <div style="display:flex;gap:1rem;align-items:center;">
      <a href="{{ profile.social.github }}" class="nav-social" target="_blank"><i class="fab fa-github"></i></a>
      <a href="{{ profile.social.linkedin }}" class="nav-social" target="_blank"><i class="fab fa-linkedin"></i></a>
      <button class="mobile-menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('mobile-open')" aria-label="Menu">☰</button>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Designed & Built by <span>{{ profile.name }}</span> &copy; 2026 &nbsp;|&nbsp; {{ profile.title }}</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
